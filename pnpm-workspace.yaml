minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@bratel/dgit@1.0.1'
# node-gyp-build: patches/node-gyp-build.patch
# patchedDependencies:
# ts-punycode@0.1.0: patches/ts-punycode@0.1.0.patch
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'

shellEmulator: true

overrides:
  # '**/semver': ^7.8.0
  semver: ^7.8.0

patchedDependencies:
  # prebuild-install: patches/prebuild-install.patch
  # registry-js: patches/registry-js.patch
  ts-punycode: patches/ts-punycode@0.1.2.patch

allowBuilds:
  '@bratel/registry-js': true
  '@bratel/webcrack': true
  es5-ext: true
  isolated-vm: true
  registry-js: true
  ts-punycode: true

ignoredBuiltDependencies:
  - registry-js

onlyBuiltDependencies:
  - '@bratel/registry-js'
  - '@bratel/webcrack'
  - es5-ext
  - isolated-vm
  # - registry-js
  - ts-punycode
